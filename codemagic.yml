workflows:
  android-app:
    name: Android App Build
    instance_type: linux
    max_build_duration: 30

    environment:
      vars:
        GRADLE_OPTS: -Xmx1536m
      groups:
        - android_credentials

    scripts:
      - name: Build Android app
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk

  python-bot:
    name: Python Bot
    instance_type: linux
    max_build_duration: 10

    scripts:
      - name: Install Python dependencies
        script: |
          pip3 install groq requests
      - name: Run bot
        script: |
          python3 bot.py
