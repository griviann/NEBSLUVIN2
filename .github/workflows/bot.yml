name: RealSatisfaction AI Automation Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Select a safe diagnostic action'
        required: true
        default: 'health_check'
        type: choice
        options:
          - health_check

concurrency:
  group: realsatisfaction-bot
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Check Groq and Facebook Connections
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION || 'v20.0' }}
        run: |
          cat > /tmp/check.py << 'PY'
          import os
          import sys
          import requests

          groq_key = os.getenv("GROQ_API_KEY")
          page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
          page_id = os.getenv("FB_PAGE_ID")
          version = os.getenv("FACEBOOK_API_VERSION", "v20.0")

          print("=== RealSatisfaction AI Health Check ===")

          if not groq_key:
              print("GROQ: FAIL - API key is missing")
              sys.exit(1)

          try:
              r = requests.post(
                  "https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
                  json={
                      "model": "openai/gpt-oss-20b",
                      "messages": [{"role": "user", "content": "Reply with OK"}],
                      "max_tokens": 100,
                      "temperature": 0,
                  },
                  timeout=30,
              )
              data = r.json()
              msg = (data.get("choices") or [{}])[0].get("message") or {}
              final = (msg.get("content") or msg.get("reasoning") or msg.get("reasoning_content") or "").strip()
              if r.ok and final:
                  print(f"GROQ: PASS - {final}")
              else:
                  print(f"GROQ: FAIL - {data}")
                  sys.exit(1)
          except Exception as e:
              print(f"GROQ: FAIL - {e}")
              sys.exit(1)

          if not page_token or not page_id:
              print("FACEBOOK: FAIL - credentials missing")
              sys.exit(1)

          try:
              rf = requests.get(f"https://graph.facebook.com/{version}/{page_id}", params={"fields": "id,name", "access_token": page_token}, timeout=25)
              df = rf.json()
              if rf.ok and str(df.get("id")) == str(page_id):
                  print(f"FACEBOOK: PASS - {df.get('name')}")
              else:
                  print(f"FACEBOOK: FAIL - {df}")
                  sys.exit(1)
          except Exception as e:
              print(f"FACEBOOK: FAIL - {e}")
              sys.exit(1)

          print("OVERALL: PASS")
          PY
          python /tmp/check.py
