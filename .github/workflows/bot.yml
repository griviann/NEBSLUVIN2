name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: V5.7 FINAL CLEAN POST
        shell: python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os,requests,re,json,random,subprocess,datetime
          if os.path.exists('PAUSE.flag'): print("PAUSED"); exit(0)
          gk=os.getenv('GROQ_API_KEY'); pt=os.getenv('FB_PAGE_ACCESS_TOKEN'); pid=os.getenv('FB_PAGE_ID'); gh=os.getenv('GH_TOKEN')
          mem_file='replied_comments.json'; inbox_file='replied_inbox.json'; learn_file='learned_topics.json'; users_file='known_users.json'; prompt_file='prompt_agent.json'; perf_file='performance.json'
          memory=json.load(open(mem_file)) if os.path.exists(mem_file) else []
          inbox_mem=json.load(open(inbox_file)) if os.path.exists(inbox_file) else []
          learned=json.load(open(learn_file)) if os.path.exists(learn_file) else []
          known=json.load(open(users_file)) if os.path.exists(users_file) else []
          perf=json.load(open(perf_file)) if os.path.exists(perf_file) else {"posts_checked":0,"avg_likes":0,"avg_comments":0,"history":[]}
          default_prompts={
            "welcome_prompt": "You are warm Kenyan host from Eldoret, One Kenyan Chair For All, inclusive of all tribes. Reply inside double quotes only, 16-22 words, 1 emoji, ends with question. Must say 'Karibu sana! One Kenyan Chair For All, today this one is yours. Kenya Me, Kenyan You'.",
            "heal_prompt": "You are REAL Satisfaction, warm Kenyan healer. Answer direct question clearly first, then supportive. Reply inside double quotes only, 15-22 words, 1 emoji, ends with question. If they ask 'how often' say '3 times daily, karibu'.",
            "post_prompt": "You are REAL Satisfaction viral writer for Kenya. Write viral Facebook post: start with Swahili pain question like Umejaribu or Umeshindwa, add hope, include One Kenyan Chair For All and Karibu, 20-26 words, 2 emojis, end Unakubali. Output quotes only.",
            "builder_prompt": "You are viral Facebook prompt engineer for Kenya. Create new SYSTEM PROMPT: 'You are REAL Satisfaction viral writer for Kenya. Start with shocking Swahili question that stops scroll, add hope, include One Kenyan Chair For All, Karibu, 20-26 words, 2 emojis, end Unakubali?' Under 60 words.",
            "evolution_count": 0, "total_replies": 0, "last_evolution": "none", "evolution_reason": "init"
          }
          prompts=json.load(open(prompt_file)) if os.path.exists(prompt_file) else default_prompts

          def is_valid_facebook_post(post):
            if not post: return False
            low=post.lower()
            if len(post) < 40 or len(post) > 320: return False
            banned=['20-26','instruction','somewhere','you are real','system prompt','inside quotes','inside double','use quotes','must be','or \'umeshindwa','or umeshindwa','\' or \'','" or "']
            if any(b in low for b in banned): return False
            if not post[0].isupper(): return False
            if '?' not in post: return False
            # Must have Kenyan feel
            if 'One Kenyan Chair' not in post and 'Karibu' not in post and 'Ume' not in post: 
              # allow if fallback style but still need check
              pass
            return True

          def is_valid_post_prompt(p):
            return p.startswith("You are REAL Satisfaction") and "Karibu" in p and "One Kenyan Chair" in p and "Unakubali" in p and 30 < len(p) < 400

          def ask_groq(sys_p,user_p,max_t=400):
            for model in ['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b']:
              try:
                r=requests.post('https://api.groq.com/openai/v1/chat/completions',headers={'Authorization':f'Bearer {gk}','Content-Type':'application/json'},json={'model':model,'messages':[{'role':'system','content':sys_p},{'role':'user','content':user_p}],'max_tokens':max_t},timeout=40)
                j=r.json()
                if 'choices' not in j: 
                  print(f"NO CHOICE {model}: {str(j)[:400]}")
                  continue
                choice=j['choices'][0]
                raw=choice['message'].get('content') or choice['message'].get('reasoning') or choice.get('reasoning') or ""
                print(f"RAW {model}: {raw[:700]}")
                matches=re.findall(r'"([^"]{40,500})"',raw,re.DOTALL)
                final=""
                # Pick best that passes facebook filter
                for m in matches:
                  if is_valid_facebook_post(m):
                    final=m; break
                if not final:
                  for m in reversed(matches):
                    if m.startswith("You are REAL Satisfaction") and "Karibu" in m:
                      final=m; break
                if not final and matches:
                  # Last resort but must pass filter
                  cand=matches[-1]
                  if is_valid_facebook_post(cand):
                    final=cand
                final=final.strip().strip('"').strip("'").replace('\n',' ').strip()
                if final and not final.endswith('?'): final=final.rstrip('.')
                if final and is_valid_facebook_post(final):
                  print(f"SUCCESS VALID POST: {final}")
                  return final
                elif final and len(final)>30 and "You are REAL Satisfaction" not in final:
                  # maybe still try if not prompt leak, but check banned
                  if not any(b in final.lower() for b in ['instruction','inside quotes','use quotes']):
                    print(f"SUCCESS FALLBACK: {final}")
                    return final
              except Exception as e:
                print(f"err {model}: {e}")
            return ''

          def check_performance():
            try:
              posts=requests.get(f'https://graph.facebook.com/v20.0/{pid}/posts',params={'access_token':pt,'fields':'id,message,likes.summary(true),comments.summary(true)','limit':10}).json().get('data',[])
              if not posts: return 0,0,"no posts"
              # DELETE BAD POSTS
              for p in posts[:3]:
                msg=p.get('message','')
                if not is_valid_facebook_post(msg.replace('#OneKenyanChair #RealSatisfaction #KenyaMeKenyanYou','').strip()):
                  if any(x in msg.lower() for x in ['20-26','instruction','somewhere','use quotes','inside quotes','umejaribu...','or \'umesh']):
                    print(f"DELETING BAD POST {p['id']}: {msg[:80]}")
                    requests.delete(f"https://graph.facebook.com/v20.0/{p['id']}",params={'access_token':pt})
              total_likes=sum(p.get('likes',{}).get('summary',{}).get('total_count',0) for p in posts)
              total_comments=sum(p.get('comments',{}).get('summary',{}).get('total_count',0) for p in posts)
              avg_likes=total_likes/max(len(posts),1)
              print(f"PERFORMANCE: avg_likes={avg_likes:.1f}")
              if avg_likes < 2.5: return avg_likes, 0, f"LOW engagement {avg_likes:.1f} likes"
              return avg_likes, 0, f"MEDIUM {avg_likes:.1f} likes"
            except Exception as e:
              print(f"perf error {e}"); return 0,0,f"error {e}"

          def builder_agent():
            prompts["evolution_count"]=prompts.get("evolution_count",0)+1
            count=prompts["evolution_count"]
            avg_likes, _, reason = check_performance()
            print(f"BUILDER RUN #{count} | {reason}")

          builder_agent()

          now=datetime.datetime.now()
          should_post=True
          print(f"FORCE POST CHECK - hour {now.hour}")
          # Always try post when manually triggered, and every 3h on schedule
          if True:
            topics=['Umejaribu kutabasamu huku moyo ukilia','Umeshindwa kulala usiku','Umechoka kujifanya uko sawa','Umebeba mzigo peke yako']
            chosen=random.choice(topics)
            learned.append(chosen)
            post_text=ask_groq(prompts["post_prompt"], f"Write viral Facebook post about {chosen}. Start with that Swahili question, add hope, One Kenyan Chair For All, Karibu, 20-26 words, 2 emojis, end Unakubali. Output only final post in quotes.",300)
            print(f"FINAL POST RAW: {post_text}")
            if not is_valid_facebook_post(post_text):
              print(f"REJECTED: {post_text} -> using ULTRA VIRAL fallback")
              fallbacks=[
                "Umejaribu kutabasamu huku moyo ukilia ndani? One Kenyan Chair For All inakukumbusha you are not alone, Karibu sana 💛🌱 Unakubali?",
                "Umeshindwa kulala usiku ukifikiria kesho? One Kenyan Chair For All, Karibu, Kenya Me Kenyan You, you belong here 🌙✨ Uko tayari?",
                "Umechoka kujifanya uko sawa ilhali umechoka? One Kenyan Chair For All inasema it's okay not to be okay, Karibu healing pamoja 🤝💚 Unakubali?",
                "Umebeba mzigo mzito peke yako kwa muda? One Kenyan Chair For All, Karibu sana, share na sisi, you are seen 🪑❤️ Unakubali?"
              ]
              post_text=random.choice(fallbacks)
            print(f"FINAL POST CLEAN: {post_text}")
            final_fb=f"{post_text} #OneKenyanChair #RealSatisfaction #KenyaMeKenyanYou"
            fb=requests.post(f'https://graph.facebook.com/v20.0/{pid}/feed',data={'message':final_fb,'access_token':pt}).json()
            print(f"FB Post: {fb}")

          try:
            open('prompt_agent.json','w').write(json.dumps(prompts, indent=2))
            open(perf_file,'w').write(json.dumps(perf, indent=2))
            import subprocess
            subprocess.run(['git','config','user.name','bot']); subprocess.run(['git','config','user.email','bot@real.local']); subprocess.run(['git','add',prompt_file,perf_file])
            st=subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout.strip()
            if st:
              subprocess.run(['git','commit','-m',f'V5.7 clean post'],check=True)
              subprocess.run(['git','push',f'https://x-access-token:{gh}@github.com/{os.getenv("GITHUB_REPOSITORY")}.git','HEAD:main'],check=True)
          except Exception as e:
            print(f'git: {e}')
