name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: V5.8 VIRAL ONLY NO GROQ POST
        shell: python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os,requests,re,json,random,subprocess,datetime
          if os.path.exists('PAUSE.flag'): print("PAUSED"); exit(0)
          gk=os.getenv('GROQ_API_KEY'); pt=os.getenv('FB_PAGE_ACCESS_TOKEN'); pid=os.getenv('FB_PAGE_ID'); gh=os.getenv('GH_TOKEN')
          mem_file='replied_comments.json'; inbox_file='replied_inbox.json'; learn_file='learned_topics.json'; users_file='known_users.json'; prompt_file='prompt_agent.json'; perf_file='performance.json'
          memory=json.load(open(mem_file)) if os.path.exists(mem_file) else []
          inbox_mem=json.load(open(inbox_file)) if os.path.exists(inbox_file) else []
          learned=json.load(open(learn_file)) if os.path.exists(learn_file) else []
          known=json.load(open(users_file)) if os.path.exists(users_file) else []
          perf=json.load(open(perf_file)) if os.path.exists(perf_file) else {"posts_checked":0,"avg_likes":0,"avg_comments":0,"history":[]}
          prompts=json.load(open(prompt_file)) if os.path.exists(prompt_file) else {}
          
          # VIRAL TEMPLATES - tested to get likes
          VIRAL_POSTS=[
            "Umebeba mzigo mzito peke yako kwa muda? One Kenyan Chair For All, Karibu sana, share na sisi, you are seen 🪑❤️ Unakubali?",
            "Umejaribu kutabasamu huku moyo ukilia ndani? One Kenyan Chair For All inakukumbusha you are not alone, Karibu sana 💛🌱 Unakubali?",
            "Umeshindwa kulala usiku ukifikiria kesho itakuwaje? One Kenyan Chair For All, Karibu, Kenya Me Kenyan You, you belong here 🌙✨ Uko tayari?",
            "Umechoka kujifanya uko sawa ilhali umechoka? One Kenyan Chair For All inasema it's okay not to be okay, Karibu healing pamoja 🤝💚 Unakubali?",
            "Umeona wivu ukigeuka inspiration? Badala ya 'mbona yeye', sema 'na mimi naweza'. One Kenyan Chair For All, Karibu 💫🌱 Unakubali?",
            "Umekuwa ukijilinganisha na wengine hadi umejisahau? One Kenyan Chair For All, your journey is yours, Karibu sana 🌟🇰🇪 Unakubali?",
            "Umehisi umetengwa kwa chama au mkutano? One Kenyan Chair For All means every Kenyan belongs, Karibu sana 🪑🤝 Unakubali?",
            "Je, umekuwa ukijinyamazisha ili wengine wafurahi? One Kenyan Chair For All, your voice matters, Karibu ongea 💬❤️ Unakubali?",
            "Umechoka kupambana peke yako? One Kenyan Chair For All, Karibu, sisi ni familia, Kenya Me Kenyan You 🌍💛 Unakubali?",
            "Umejaribu kusamehe lakini moyo bado unauma? One Kenyan Chair For All, healing ni safari, Karibu pole pole 🌱💚 Unakubali?"
          ]

          def ask_groq(sys_p,user_p,max_t=200):
            # Only for comments/inbox - posts are now VIRAL ONLY
            for model in ['openai/gpt-oss-20b']:
              try:
                r=requests.post('https://api.groq.com/openai/v1/chat/completions',headers={'Authorization':f'Bearer {gk}','Content-Type':'application/json'},json={'model':model,'messages':[{'role':'system','content':sys_p},{'role':'user','content':user_p}],'max_tokens':max_t},timeout=30)
                j=r.json()
                if 'choices' not in j: continue
                raw=j['choices'][0]['message'].get('content') or j['choices'][0]['message'].get('reasoning') or ""
                m=re.findall(r'"([^"]{15,300})"',raw)
                if m: return m[-1].strip()[:200]
                return raw.strip()[:200]
              except Exception as e:
                print(f"groq err {e}")
            return ''

          # CLEAN BAD POSTS
          try:
            posts=requests.get(f'https://graph.facebook.com/v20.0/{pid}/posts',params={'access_token':pt,'fields':'id,message','limit':10}).json().get('data',[])
            for p in posts[:5]:
              msg=(p.get('message') or '').lower()
              if any(x in msg for x in ['use quotes','inside quotes','or \'umesh','20-26 words','instruction','somewhere. also']):
                print(f"DELETING BAD POST {p['id']}: {msg[:80]}")
                requests.delete(f"https://graph.facebook.com/v20.0/{p['id']}",params={'access_token':pt})
          except Exception as e:
            print(f"clean error {e}")

          # POST - VIRAL ONLY, no Groq
          now=datetime.datetime.now()
          # Post every 3 hours, but force if last post was bad (we just deleted)
          should_post = (now.hour % 3 == 0 and now.minute < 30) or True  # Force once now
          if should_post:
            # Pick not recently used
            avail=[v for v in VIRAL_POSTS if v not in learned[-5:]]
            post_text=random.choice(avail or VIRAL_POSTS)
            learned.append(post_text)
            if len(learned)>30: learned.pop(0)
            print(f"VIRAL POST: {post_text}")
            final_fb=f"{post_text} #OneKenyanChair #RealSatisfaction #KenyaMeKenyanYou"
            fb=requests.post(f'https://graph.facebook.com/v20.0/{pid}/feed',data={'message':final_fb,'access_token':pt}).json()
            print(f"FB Post: {fb}")

          # Comments reply still uses Groq (short replies work)
          try:
            posts=requests.get(f'https://graph.facebook.com/v20.0/{pid}/posts',params={'access_token':pt,'limit':5}).json().get('data',[])
            for p in posts:
              pid2=p['id']
              comms=requests.get(f"https://graph.facebook.com/v20.0/{pid2}/comments",params={'access_token':pt,'fields':'id,message,from','limit':15}).json().get('data',[])
              for c in comms:
                cid=c['id']
                if cid in memory: continue
                if c.get('from',{}).get('id')==pid: continue
                txt=c.get('message','')
                if not txt: continue
                uid=c.get('from',{}).get('id','')
                is_new=uid and uid not in known
                welcome="You are warm Kenyan host, One Kenyan Chair For All. Reply inside quotes 16-22 words 1 emoji ends question. Say Karibu sana One Kenyan Chair For All today this one is yours."
                heal="You are REAL Satisfaction healer. Reply inside quotes 15-22 words 1 emoji ends question."
                sys=welcome if is_new else heal
                reply=ask_groq(sys, f"Reply to: '{txt}'")
                if not reply: reply="Karibu sana! One Kenyan Chair For All, today this one is yours. Kenya Me, Kenyan You"
                print(f'COMMENT {"NEW" if is_new else ""} {txt[:30]} => {reply[:60]}')
                requests.post(f'https://graph.facebook.com/v20.0/{cid}/comments',data={'message':reply+'?','access_token':pt})
                memory.append(cid)
                if uid and uid not in known: known.append(uid)
          except Exception as e:
            print(f'comment error: {e}')

          try:
            open(mem_file,'w').write(json.dumps(memory[-300:])); open(inbox_file,'w').write(json.dumps(inbox_mem[-300:])); open(learn_file,'w').write(json.dumps(learned)); open(users_file,'w').write(json.dumps(known[-500:])); open(prompt_file,'w').write(json.dumps(prompts, indent=2)); open(perf_file,'w').write(json.dumps(perf, indent=2))
            subprocess.run(['git','config','user.name','bot']); subprocess.run(['git','config','user.email','bot@real.local']); subprocess.run(['git','add',mem_file,inbox_file,learn_file,users_file,prompt_file,perf_file])
            st=subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout.strip()
            if st:
              subprocess.run(['git','commit','-m',f'V5.8 viral only'],check=True)
              subprocess.run(['git','push',f'https://x-access-token:{gh}@github.com/{os.getenv("GITHUB_REPOSITORY")}.git','HEAD:main'],check=True)
              print('Saved V5.8')
          except Exception as e:
            print(f'git: {e}')
