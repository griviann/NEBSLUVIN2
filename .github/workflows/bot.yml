name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python - << 'PY'
          import os,requests
          gk=os.getenv("GROQ_API_KEY")
          pt=os.getenv("FB_PAGE_ACCESS_TOKEN")
          pid=os.getenv("FB_PAGE_ID")
          print("Keys loaded:", bool(gk), bool(pt), bool(pid))
          url="https://api.groq.com/openai/v1/chat/completions"
          payload={
            "model":"openai/gpt-oss-20b",
            "messages":[{"role":"user","content":"Write a short Facebook post about self love healing. 15 words, emotional, 2 emojis."}],
            "max_tokens":100
          }
          r=requests.post(url,headers={"Authorization":f"Bearer {gk}","Content-Type":"application/json"},json=payload,timeout=30)
          print(f"Status: {r.status_code}")
          data=r.json()
          print(f"Full response: {data}")
          try:
              content=data["choices"][0]["message"]["content"]
              print(f"RAW content: {content}")
              clean=content.split("\n")[0].strip()
              if "Count" in clean: clean=clean.split("Count")[0]
              print(f"CLEAN: {clean}")
              if clean and len(clean)>10:
                  fb=requests.post(f"https://graph.facebook.com/v20.0/{pid}/feed",data={"message":clean,"access_token":pt},timeout=25)
                  print(f"FB: {fb.status_code} {fb.json()}")
          except Exception as e:
              print(f"Error: {e}")
          PY
