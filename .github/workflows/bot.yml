name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python - << 'PY'
          import os, json, random, time, requests
          from datetime import datetime, timezone, timedelta

          PAGE_ID = os.environ['PAGE_ID']
          PAGE_TOKEN = os.environ['PAGE_TOKEN']
          GROQ_KEY = os.environ['GROQ_API_KEY']
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          EAT = timezone(timedelta(hours=3))
          now_eat = datetime.now(EAT)

          # Post every 2 hours still
          should_post = (now_eat.hour % 2 == 0 and now_eat.minute < 15)

          # --- FILES ---
          def load_json(name, default):
              try:
                  with open(name) as f: return json.load(f)
              except: return default

          replied = set(load_json("replied_comments.json", []))
          users = load_json("known_users.json", {})

          def save():
              with open("replied_comments.json","w") as f: json.dump(list(replied), f)
              with open("known_users.json","w") as f: json.dump(users, f)

          # --- V7 HUMAN BRAIN ---
          def ask_groq(user_text, name, is_new):
              txt = user_text.strip()[:300]
              low = txt.lower()

              # No template replies - we let the big model feel it
              sys_p = f"""You are REAL Satisfaction, a warm Kenyan human healer behind One Kenyan Chair For All.
              You are NOT a bot, not an AI. You are a person who listens.

              Chair meaning: A safe space where Kenyans rest when life is heavy. No fixing, just listening with heart.

              WHO you talk to: {name}, {'NEW person, first time on Chair' if is_new else 'returning friend who missed us'}.

              HOW TO THINK:
              - First feel: what is this person feeling? (tired? lonely? hopeful? missed us?)
              - If they say "where have you been / umekuwa wapi / me please / interested" = they are vulnerable. Don't give a definition of Chair. Be warm, a bit personal, like "nimerudi, missed this space".
              - If they say "Me please" = they are saying "please see me". Welcome them softly, don't repeat same line.
              - Never say: "today this one is yours", "As an AI", "I am a bot", "bila judgment" in every reply (use sparingly).
              - Speak like Kenyan WhatsApp: Swahili + English naturally, short, warm.

              STYLE:
              - 18-30 words only, natural
              - 1 emoji max, or none. Use 💛 🤝 🌙 🪑 gently
              - End with a soft question that invites sharing
              - Don't repeat name every time, sometimes just "karibu"
              - Be fresh, never same sentence as before.

              User said: "{txt}"
              Reply now as REAL:"""

              try:
                  r = requests.post(GROQ_URL, headers={"Authorization": f"Bearer {GROQ_KEY}","Content-Type":"application/json"},
                  json={
                      "model":"llama-3.3-70b-versatile",
                      "messages":[{"role":"system","content":sys_p},{"role":"user","content":txt}],
                      "temperature":0.85,
                      "max_tokens":120
                  }, timeout=20)
                  if r.status_code==200:
                      ans = r.json()['choices'][0]['message']['content'].strip()
                      # clean generic leftover if model slips
                      ans = ans.replace("today this one is yours","this chair is yours for now")
                      ans = ans.replace("Today this one is yours","this chair is yours for now")
                      return ans[:220]
              except Exception as e:
                  print(f"Groq fail {e}")

              # Fallback human, not generic
              fallbacks = [
                  f"Karibu sana {name}, niko hapa. Take a breath, you don't have to be strong here. What is heavy today? 🤝",
                  f"Hey {name}, thanks for coming, this chair is yours now. I'm really listening, unajisikiaje leo? 💛",
                  f"Karibu {name}, asante for trusting this space. I'm here, no rush. What would you like to share? 🪑",
                  f"Karibu sana, niko hapa kukusikia. Whatever you carry, you can put it down here. Unataka tuanze wapi? 🌙"
              ]
              return random.choice(fallbacks)

          # --- POSTING (keep your old prompts) ---
          if should_post:
              print(f"Posting time {now_eat}")
              # use your normal post logic here, or keep simple for test
              try:
                  msg = f"One Kenyan Chair For All - Karibu sana. Niko hapa kukusikia. Unajisikiaje leo? 🪑 {now_eat.strftime('%H:%M')}"
                  requests.post(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed",
                      data={"message": msg, "access_token": PAGE_TOKEN}, timeout=15)
                  print("Posted")
              except Exception as e:
                  print(e)

          # --- REPLY LOGIC - V7 ---
          print("Found posts to check")
          try:
              posts = requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}/posts?limit=5&access_token={PAGE_TOKEN}", timeout=15).json().get('data',[])
              print(f"Found {len(posts)} posts to check comments")
              count=0
              for p in posts:
                  if count>=5: break
                  pid=p['id']
                  comms = requests.get(f"https://graph.facebook.com/v19.0/{pid}/comments?limit=30&filter=stream&access_token={PAGE_TOKEN}", timeout=15).json().get('data',[])
                  for c in comms:
                      cid=c['id']
                      if cid in replied: continue
                      if c.get('from',{}).get('id')==PAGE_ID: continue
                      text=c.get('message','')
                      if not text: continue
                      if len(text.strip())<2: continue
                      
                      from_id = c.get('from',{}).get('id','')
                      from_name = c.get('from',{}).get('name','rafiki')
                      is_new = from_id not in users

                      reply_text = ask_groq(text, from_name.split()[0], is_new)
                      
                      # Send reply
                      rr = requests.post(f"https://graph.facebook.com/v19.0/{cid}/comments",
                          data={"message": reply_text, "access_token": PAGE_TOKEN}, timeout=15)
                      if rr.status_code==200:
                          print(f"Replied to {cid}: {reply_text}")
                          replied.add(cid)
                          users[from_id]=from_name
                          save()
                          count+=1
                          time.sleep(2)
                      else:
                          print(f"Reply fail {rr.text}")
                      if count>=5: break
          except Exception as e:
              print(f"Comment loop error {e}")

          save()
          PY
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add replied_comments.json known_users.json || true
          git diff --staged --quiet || git commit -m "update memory"
          git push || true
