name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: V3.2 REAL AI - Leak Proof + Comments + Inbox - FIXED
        shell: python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, requests, re, json, random, subprocess, datetime
          gk=os.getenv("GROQ_API_KEY")
          pt=os.getenv("FB_PAGE_ACCESS_TOKEN")
          pid=os.getenv("FB_PAGE_ID")
          app_id=os.getenv("FB_APP_ID")
          app_secret=os.getenv("FB_APP_SECRET")
          gh=os.getenv("GH_TOKEN")
          
          mem_file="replied_comments.json"
          inbox_file="replied_inbox.json"
          learn_file="learned_topics.json"
          
          memory=json.load(open(mem_file)) if os.path.exists(mem_file) else []
          inbox_mem=json.load(open(inbox_file)) if os.path.exists(inbox_file) else []
          learned=json.load(open(learn_file)) if os.path.exists(learn_file) else []
          
          BANNED = ["mjinga", "umbwa", "meffi"]
          LEAK = ["Answer inside double quotes", "18-24 words", "1-2 emojis"]
          
          def is_clean(text):
            if not text: return False
            low=text.lower()
            if any(w in low for w in BANNED): return False
            if any(p.lower() in low for p in LEAK): return False
            return True
          
          SYSTEM="You are REAL Satisfaction AI. Warm mature healer. Answer inside double quotes only, 18-24 words, 1-2 emojis, ends with question."
          
          def ask(sys, usr, model):
            try:
              r=requests.post("https://api.groq.com/openai/v1/chat/completions",headers={"Authorization":f"Bearer {gk}","Content-Type":"application/json"},json={"model":model,"messages":[{"role":"system","content":sys},{"role":"user","content":usr}],"max_tokens":300},timeout=40)
              j=r.json()
              print(f"FULL GROQ: {str(j)[:800]}")
              if "choices" not in j:
                print(f"GROQ API ERROR: {j}")
                return ""
              raw=j["choices"][0]["message"].get("content") or ""
              print(f"RAW {model}: {raw[:400]}")
              if not is_clean(raw):
                print("LEAK BLOCKED")
                return ""
              m=re.search(r'"([^"]{10,400})"',raw,re.DOTALL)
              final=m.group(1).strip() if m else ""
              if not final:
                print("No quoted text found, blocking")
                return ""
              if not is_clean(final):
                return ""
              return final.strip().rstrip("?").strip()
            except Exception as e:
              print(f"err {model}: {e}")
              return ""
          
          # TOKEN AUTO-REFRESH
          try:
            debug_url=f"https://graph.facebook.com/debug_token?input_token={pt}&access_token={app_id}|{app_secret}"
            info=requests.get(debug_url).json()
            expires=info.get("data",{}).get("expires_at",0)
            now_ts=datetime.datetime.now().timestamp()
            if expires and expires - now_ts < 864000:
              print("TOKEN EXPIRING SOON - Refreshing...")
              ex_url=f"https://graph.facebook.com/v18.0/oauth/access_token?grant_type=fb_exchange_token&client_id={app_id}&client_secret={app_secret}&fb_exchange_token={pt}"
              new_t=requests.get(ex_url).json().get("access_token")
              if new_t: print(f"NEW TOKEN: {new_t[:30]}... SAVE TO SECRETS!")
            else:
              print("Token OK")
          except Exception as e:
            print(f"token check skip: {e}")
          
          # POST EVERY 3 HOURS
          now=datetime.datetime.now()
          should_post = (now.hour % 3 == 0 and now.minute < 20)
          print(f"UTC hour {now.hour}, minute {now.minute}, should_post={should_post}")
          
          if should_post:
            topics=["why kindness is revolutionary","how setting boundaries protects peace","self-worth when you feel behind","mental health its okay to not be okay","forgiveness as freedom","community healing checking on silent friends","words have power speak life","rest is productive","empathy listening to understand"]
            avail=[t for t in topics if t not in learned[-5:]]
            chosen=random.choice(avail or topics)
            learned.append(chosen)
            if len(learned)>30: learned.pop(0)
            open(learn_file,"w").write(json.dumps(learned))
            print(f"Researching: {chosen}")
            post_text=ask(SYSTEM, f"Create Facebook post about {chosen}. Positive impact. 18 words 2 emojis 2 hashtags #RealSatisfaction #Healing. Inside quotes.", "llama-3.3-70b-versatile")
            if not post_text:
              post_text=ask(SYSTEM, f"Create Facebook post about {chosen}. Inside quotes.", "llama-3.1-8b-instant")
            print(f"FINAL POST: {post_text}")
            if post_text and len(post_text)>15:
              final_fb = f"{post_text}? 🌱🤝 #RealSatisfaction #Healing"
              url="https://graph.facebook.com/v20.0/"+pid+"/feed"
              fb=requests.post(url,data={"message":final_fb,"access_token":pt}).json()
              print(f"FB Post Result: {fb}")
          else:
            print("Skip post this run")
          
          # REPLY COMMENTS
          try:
            posts=requests.get(f"https://graph.facebook.com/v20.0/{pid}/posts",params={"access_token":pt,"limit":5}).json()
            for p in posts.get("data",[]):
              post_id=p["id"]
              comms=requests.get(f"https://graph.facebook.com/v20.0/{post_id}/comments",params={"access_token":pt,"fields":"id,message,from","limit":20}).json()
              for c in comms.get("data",[]):
                cid=c["id"]
                if cid in memory: continue
                if c.get("from",{}).get("id")==pid: continue
                ctext=c.get("message","")
                if not ctext: continue
                reply=ask("You are warm healer replying to Facebook comment. Inside quotes 12-18 words, 1 emoji, question.", f"Reply empathetically to: '{ctext}'. Inside quotes.", "llama-3.3-70b-versatile")
                if not reply:
                  reply=ask("You are warm healer. Inside quotes 12-18 words, 1 emoji, question.", f"Reply to: '{ctext}'. Inside quotes.", "llama-3.1-8b-instant")
                if reply and is_clean(reply):
                  url2="https://graph.facebook.com/v20.0/"+cid+"/comments"
                  r2=requests.post(url2,data={"message":reply,"access_token":pt}).json()
                  print(f"Replied {cid}: {reply} -> {r2}")
                  memory.append(cid)
                  if len(memory)>300: memory=memory[-300:]
          except Exception as e:
            print(f"comment error: {e}")
          
          # REPLY INBOX DM
          try:
            conv_url=f"https://graph.facebook.com/v20.0/{pid}/conversations"
            convs=requests.get(conv_url,params={"access_token":pt,"fields":"id,messages{id,message,from}","limit":10}).json()
            for conv in convs.get("data",[])[:10]:
              msgs=conv.get("messages",{}).get("data",[])
              if not msgs: continue
              last=msgs[0]
              mid=last["id"]
              if mid in inbox_mem: continue
              if last.get("from",{}).get("id")==pid: continue
              low=last.get("message","").lower()
              if "stress" in low or "sad" in low:
                reply_inbox="Pole sana mkuu, niko hapa. Your quiet presence matters. Tuongee kidogo?"
              elif "help" in low or "msaada" in low:
                reply_inbox="Niko hapa mkuu, karibu. Tell me more, niko na time yako. Pamoja tutapata solution?"
              else:
                reply_inbox="Asante kwa DM mkuu. Nimepokea message yako. Niko hapa kukusupport, poa poa?"
              send_url=f"https://graph.facebook.com/v20.0/{conv['id']}/messages"
              r3=requests.post(send_url,data={"message":reply_inbox,"access_token":pt}).json()
              print(f"Inbox replied {mid}: {r3}")
              inbox_mem.append(mid)
              if len(inbox_mem)>300: inbox_mem=inbox_mem[-300:]
          except Exception as e:
            print(f"inbox error: {e}")
          
          # SAVE MEMORY
          try:
            open(mem_file,"w").write(json.dumps(memory))
            open(inbox_file,"w").write(json.dumps(inbox_mem))
            open(learn_file,"w").write(json.dumps(learned))
            subprocess.run(["git","config","user.name","bot"],check=True)
            subprocess.run(["git","config","user.email","bot@real.local"],check=True)
            subprocess.run(["git","add",mem_file,inbox_file,learn_file],check=True)
            subprocess.run(["git","commit","-m","V3.2 leak-proof + inbox + fixed model"],check=True)
            subprocess.run(["git","push",f"https://x-access-token:{gh}@github.com/{os.getenv('GITHUB_REPOSITORY')}.git","HEAD:main"],check=True)
            print("Memory saved")
          except Exception as e:
            print(f"git: {e}")
