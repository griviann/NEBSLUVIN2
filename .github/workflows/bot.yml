name: test-keys
on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - << 'PY'
          import os, requests
          PAGE_ID = os.environ['PAGE_ID'].strip()
          PAGE_TOKEN = os.environ['PAGE_TOKEN'].strip()
          print(f"PAGE_ID length: {len(PAGE_ID)} value starts with: {PAGE_ID[:4]}...")
          print(f"PAGE_TOKEN length: {len(PAGE_TOKEN)} starts with: {PAGE_TOKEN[:10]}...")
          
          # Test 1: Is Page ID valid?
          r1 = requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}?fields=id,name,access_token&access_token={PAGE_TOKEN}", timeout=15).json()
          print(f"TEST PAGE CHECK: {r1}")
          
          # Test 2: Can we read posts?
          r2 = requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}/posts?limit=1&access_token={PAGE_TOKEN}", timeout=15).json()
          print(f"TEST POSTS READ: {r2}")
          
          # Test 3: Can we still post? (we won't actually post, just check permission)
          # If r1 has error code 190 = token expired. If error 100 subcode 33 = PAGE_ID wrong
          if 'error' in r1:
              print(f"ERROR CODE: {r1['error'].get('code')} SUBCODE: {r1['error'].get('error_subcode')} MESSAGE: {r1['error'].get('message')}")
          PY
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
