python - <<'PY'
import os, sys, requests
groq_key = os.getenv("GROQ_API_KEY")
page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
page_id = os.getenv("FB_PAGE_ID")
version = os.getenv("FACEBOOK_API_VERSION", "v20.0")

print("=== RealSatisfaction AI Health Check ===")

# GROQ - handle reasoning models correctly
r = requests.post("https://api.groq.com/openai/v1/chat/completions",
  headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
  json={
    "model": "openai/gpt-oss-20b",
    "messages": [{"role": "user", "content": "Reply with OK"}],
    "max_tokens": 50,
    "temperature": 0
  }, timeout=30)
data = r.json()

# Professional: support both chat and reasoning models
choice = (data.get("choices") or [{}])[0]
msg = choice.get("message") or {}
content = (msg.get("content") or "").strip()
reasoning = (msg.get("reasoning") or msg.get("reasoning_content") or "").strip()
final_text = content or reasoning

if r.ok and final_text:
    print(f"GROQ: PASS - AI response received: {final_text[:20]}")
else:
    print(f"GROQ: FAIL - HTTP {r.status_code} | Content='{content}' Reasoning='{reasoning}' | Full={data}")
    sys.exit(1)

# FACEBOOK
rf = requests.get(f"https://graph.facebook.com/{version}/{page_id}",
  params={"fields": "id,name", "access_token": page_token}, timeout=25)
df = rf.json()
if rf.ok and str(df.get("id")) == str(page_id):
    print(f"FACEBOOK: PASS - {df.get('name')}")
else:
    print(f"FACEBOOK: FAIL - {rf.status_code} | {df}")
    sys.exit(1)

print("OVERALL: PASS")
PY
