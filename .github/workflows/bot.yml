name: REAL-Chair-Healer-Fixed

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours - saves your free tokens
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Reply to comments - No Duplicate + Backup Brain
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - << 'PY'
          import requests, os, time

          PAGE_ID = os.getenv("PAGE_ID")
          PAGE_TOKEN = os.getenv("PAGE_TOKEN")
          GROQ_KEY = os.getenv("GROQ_KEY")
          OPENROUTER_KEY = os.getenv("OPENROUTER_KEY")

          # 1. GET YOUR RECENT POSTS
          posts_url = f"https://graph.facebook.com/v19.0/{PAGE_ID}/posts?limit=5&access_token={PAGE_TOKEN}"
          posts = requests.get(posts_url).json().get('data', [])

          HEALING_PROMPT = """
          You are REAL satisfaction Kenyan Chair, warm, healing, Sheng mix. 
          Chair = mahali pa kupumua bila kuhukumiwa.
          Never be formal. Use pole pole, karibu sana, uko salama.
          Reply in 40-60 words max, warm, ask gentle question.
          Comment to reply: {comment_text}
          Person name: {name}
          Reply as warm Kenyan friend, not customer service.
          """

          def get_healing_reply(comment_text, name):
              prompt = HEALING_PROMPT.format(comment_text=comment_text, name=name)
              # TRY 1: GROQ
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={"model": "llama-3.1-8b-instant", "messages": [{"role": "user", "content": prompt}], "max_tokens": 120, "temperature": 0.8},
                      timeout=20)
                  r.raise_for_status()
                  return r.json()['choices'][0]['message']['content']
              except Exception as e:
                  print(f"Groq failed: {e} -> Trying OpenRouter backup")
                  # TRY 2: OPENROUTER FREE BACKUP
                  try:
                      r2 = requests.post("https://openrouter.ai/api/v1/chat/completions",
                          headers={"Authorization": f"Bearer {OPENROUTER_KEY}", "Content-Type": "application/json"},
                          json={"model": "meta-llama/llama-3.1-8b-instruct:free", "messages": [{"role": "user", "content": prompt}], "max_tokens": 120, "temperature": 0.8},
                          timeout=30)
                      r2.raise_for_status()
                      return r2.json()['choices'][0]['message']['content']
                  except Exception as e2:
                      print(f"Backup also failed: {e2}")
                      return None

          for post in posts:
              post_id = post['id']
              # Get comments
              comments_url = f"https://graph.facebook.com/v19.0/{post_id}/comments?filter=stream&fields=id,message,from,comments{{from}}&access_token={PAGE_TOKEN}"
              comments_data = requests.get(comments_url).json().get('data', [])
              
              for c in comments_data:
                  comment_id = c['id']
                  text = c.get('message','')
                  name = c.get('from',{}).get('name','')
                  replies = c.get('comments',{}).get('data',[])

                  # FIX 1: NO DUPLICATE - Check if PAGE already replied
                  already_replied = any(rep.get('from',{}).get('id') == PAGE_ID for rep in replies)
                  if already_replied:
                      print(f"Skipping {name} - already replied")
                      continue
                  if not text or len(text) < 2:
                      continue
                  if c.get('from',{}).get('id') == PAGE_ID:
                      continue

                  # FIX 2: Generate with backup
                  reply_text = get_healing_reply(text, name)
                  if not reply_text:
                      continue

                  # Post reply
                  reply_url = f"https://graph.facebook.com/v19.0/{comment_id}/comments"
                  requests.post(reply_url, data={"message": reply_text, "access_token": PAGE_TOKEN})
                  print(f"Replied to {name}: {reply_text[:50]}...")
                  time.sleep(5)

          print("Done - No duplicates, backup used if needed")
          PY
