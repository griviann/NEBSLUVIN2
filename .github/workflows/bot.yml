def ask_groq(user_text, is_new_user):
  txt=user_text.strip()[:250]
  low=txt.lower()
  if low.strip() in ["me please","me","interested","i need","nipo","sawa","me"]:
    return "Karibu sana! One Kenyan Chair For All, niko hapa kukusikia. Unajisikiaje leo? 🪑"

  # SMART PROMPT FOR FREE MODEL - teaches it to be like Meta AI
  sys_p = """You are REAL Satisfaction, a warm emotionally intelligent Kenyan healer for One Kenyan Chair For All.
ONE KENYAN CHAIR = safe space where Kenyans share burdens, heal together, no judgment, Kenya Me Kenyan You.

Your thinking steps (MUST follow):
1. Detect emotion: is user curious, skeptical, sad, stuck, overthinking?
2. Validate it in 4-6 words (e.g., 'It's okay to wonder how this works')
3. Explain Chair benefit that matches their emotion
4. Ask a specific follow-up question about THEIR situation, not generic.

Rules: 22-30 words, Swahili+English natural, 1 emoji, end with ?, never say 'today this one is yours'.

Examples you MUST copy style:
Q: "how exactly will you assist me?" 
A: "Karibu sana, it's valid to ask how this helps. One Kenyan Chair For All offers a safe listening space to offload what weighs on you bila judgment. What's been heavy lately? 🪑"

Q: "I'm just within"
A: "Karibu sana, feeling stuck within your own thoughts can be heavy. One Kenyan Chair For All holds space for you bila judgment. What thoughts are circling today? 🧠"
"""

  try:
    r=requests.post('https://api.groq.com/openai/v1/chat/completions',
      headers={'Authorization':f'Bearer {gk}','Content-Type':'application/json'},
      json={
        'model':'llama-3.1-8b-instant',  # FREE TIER - stays free
        'messages':[
          {'role':'system','content':sys_p},
          {'role':'user','content':f"Comment: {txt}. Reply following your thinking steps."}
        ],
        'max_tokens':140,
        'temperature':0.8
      },timeout=20)
    ans=r.json()['choices'][0]['message']['content'].strip().replace('\n',' ').strip('"').strip("'")
    ans=ans[:260]
    if ans.count('?')>1: ans=ans.rsplit('?',1)[0]+'?'
    if not ans.endswith('?'): ans=ans.rstrip('.')+'?'
    # fix emoji space bug
    ans=ans.replace(' 🪑 ?',' 🪑?').replace(' ?','?').replace('🪑?','🪑')
    if not ans.endswith('?'): ans+='?'
    return ans
  except Exception as e:
    print(f"groq err {e}")
    return "Karibu sana! One Kenyan Chair For All is a safe space to share your heart bila judgment, we listen pamoja. What's on your mind today? 🪑"
