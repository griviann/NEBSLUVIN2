name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python - << 'PY'
          import os, json, random, time, requests
          from datetime import datetime, timezone, timedelta
          PAGE_ID = os.environ['PAGE_ID'].strip()
          PAGE_TOKEN = os.environ['PAGE_TOKEN'].strip()
          GROQ_KEY = os.environ['GROQ_API_KEY'].strip()
          print(f"PAGE_ID len={len(PAGE_ID)} PAGE_TOKEN len={len(PAGE_TOKEN)}")
          EAT = timezone(timedelta(hours=3))
          now = datetime.now(EAT)
          should_post = now.hour % 2 == 0 and now.minute < 15
          def load_json(n,d):
            try:
              with open(n) as f:
                return json.load(f)
            except:
              return d
          replied=set(load_json("replied_comments.json",[]))
          users=load_json("known_users.json",{})
          def save():
            with open("replied_comments.json","w") as f:
              json.dump(list(replied),f)
            with open("known_users.json","w") as f:
              json.dump(users,f)
          def ask_groq(txt,name):
            try:
              r=requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization": f"Bearer {GROQ_KEY}","Content-Type":"application/json"}, json={"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":f"You are REAL Satisfaction, warm Kenyan healer. {name} said: {txt}. Reply 20 words warm, 1 emoji."}],"temperature":0.85,"max_tokens":100}, timeout=20)
              if r.status_code==200:
                return r.json()['choices'][0]['message']['content'].strip()[:220]
            except Exception as e:
              print(f"Groq err {e}")
            return f"Karibu sana {name}, niko hapa. What is heavy today? 🤝"
          if should_post:
            requests.post(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed", data={"message":"One Kenyan Chair For All 🪑 Sometimes you just need a place to breathe. What are you carrying today? 💛","access_token":PAGE_TOKEN})
          posts=requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed?limit=5&access_token={PAGE_TOKEN}").json().get('data',[])
          print(f"Found {len(posts)} posts")
          c=0
          for p in posts:
            if c>=5:
              break
            for comm in requests.get(f"https://graph.facebook.com/v19.0/{p['id']}/comments?limit=20&access_token={PAGE_TOKEN}").json().get('data',[]):
              if comm['id'] in replied:
                continue
              if comm.get('from',{}).get('id')==PAGE_ID:
                continue
              txt=comm.get('message','')
              if len(txt)<2:
                continue
              name=comm.get('from',{}).get('name','rafiki').split()[0]
              reply=ask_groq(txt,name)
              if requests.post(f"https://graph.facebook.com/v19.0/{comm['id']}/comments", data={"message":reply,"access_token":PAGE_TOKEN}).status_code==200:
                replied.add(comm['id'])
                save()
                c+=1
                time.sleep(2)
              if c>=5:
                break
          save()
          PY
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add replied_comments.json known_users.json || true
          git diff --staged --quiet || git commit -m "update memory"
          git push || true
