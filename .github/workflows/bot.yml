name: heal
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Reply to comments - No Duplicate + Backup Brain
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - << 'PY'
          import requests, os, time
          PAGE_ID = os.getenv("PAGE_ID","").strip()
          PAGE_TOKEN = os.getenv("PAGE_TOKEN","").strip()
          GROQ_KEY = os.getenv("GROQ_KEY","").strip()
          OPENROUTER_KEY = os.getenv("OPENROUTER_KEY","").strip()

          print(f"PAGE_ID length: {len(PAGE_ID)} ID: {PAGE_ID[:10]}...")
          
          # Use FEED - posts fails if no permission
          url = f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed?limit=5&access_token={PAGE_TOKEN}"
          data = requests.get(url).json()
          
          if "error" in data:
              print(f"FACEBOOK ERROR: {data['error']}")
              posts = []
          else:
              posts = data.get("data", [])
          
          print(f"Found {len(posts)} posts")

          if len(posts)==0:
              print(f"Full response: {data}")
              exit(0)

          PROMPT = "You are REAL satisfaction Kenyan Chair, warm healing Sheng mix. Chair=mahali pa kupumua bila kuhukumiwa. Pole pole, karibu sana. Reply 50 words max warm. Comment: {comment_text} Name: {name}"

          def get_reply(txt, name):
              pr = PROMPT.format(comment_text=txt, name=name)
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={"model": "llama-3.1-8b-instant", "messages": [{"role": "user", "content": pr}], "max_tokens": 120}, timeout=20)
                  r.raise_for_status()
                  print("Groq ok")
                  return r.json()['choices'][0]['message']['content']
              except Exception as e:
                  print(f"Groq fail: {e}")
                  try:
                      r2 = requests.post("https://openrouter.ai/api/v1/chat/completions",
                          headers={"Authorization": f"Bearer {OPENROUTER_KEY}", "Content-Type": "application/json"},
                          json={"model": "meta-llama/llama-3.1-8b-instruct:free", "messages": [{"role": "user", "content": pr}]}, timeout=30)
                      r2.raise_for_status()
                      print("OpenRouter ok")
                      return r2.json()['choices'][0]['message']['content']
                  except Exception as e2:
                      print(f"Backup fail: {e2}")
                      return None

          for post in posts:
              pid = post['id']
              c_url = f"https://graph.facebook.com/v19.0/{pid}/comments?order=reverse_chronological&fields=id,message,from,comments{{from}}&limit=50&access_token={PAGE_TOKEN}"
              comms = requests.get(c_url).json().get('data', [])
              print(f"Post {pid} -> {len(comms)} comments")
              for c in comms:
                  txt=c.get('message',''); name=c.get('from',{}).get('name',''); cid=c['id']; reps=c.get('comments',{}).get('data',[])
                  print(f"Checking: {name} - {txt[:30]}")
                  if any(r.get('from',{}).get('id')==PAGE_ID for r in reps):
                      print(f"Skip {name} already replied")
                      continue
                  if not txt or c.get('from',{}).get('id')==PAGE_ID:
                      continue
                  reply=get_reply(txt,name)
                  if not reply: continue
                  requests.post(f"https://graph.facebook.com/v19.0/{cid}/comments", data={"message": reply, "access_token": PAGE_TOKEN})
                  print(f"REPLIED to {name}")
                  time.sleep(5)
          print("Done")
          PY
