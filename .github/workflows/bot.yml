name: RealSatisfaction AI Automation Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Select a safe diagnostic action'
        required: true
        default: 'health_check'
        type: choice
        options:
          - health_check

concurrency:
  group: realsatisfaction-bot
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: python -m pip install requests

      - name: Check Groq and Facebook Connections
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION || 'v20.0' }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          groq_key = os.getenv("GROQ_API_KEY")
          page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
          page_id = os.getenv("FB_PAGE_ID")
          version = os.getenv("FACEBOOK_API_VERSION", "v20.0")

          print("=== RealSatisfaction AI Health Check ===")

          # --- GROQ TEST (Fixed for gpt-oss-20b reasoning model) ---
