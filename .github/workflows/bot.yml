name: REAL-Chair-Healer-Fixed

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Reply to comments - No Duplicate + Backup Brain
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - << 'PY'
          import requests, os, time
          PAGE_ID = os.getenv("PAGE_ID")
          PAGE_TOKEN = os.getenv("PAGE_TOKEN")
          GROQ_KEY = os.getenv("GROQ_KEY")
          OPENROUTER_KEY = os.getenv("OPENROUTER_KEY")

          posts_url = f"https://graph.facebook.com/v19.0/{PAGE_ID}/posts?limit=3&access_token={PAGE_TOKEN}"
          posts_data = requests.get(posts_url).json()
          posts = posts_data.get('data', [])
          print(f"Found {len(posts)} posts")

          HEALING_PROMPT = "You are REAL satisfaction Kenyan Chair, warm healing, Sheng mix. Chair=mahali pa kupumua bila kuhukumiwa. Use pole pole, karibu sana. Reply 50 words max warm. Comment: {comment_text} Name: {name}"

          def get_healing_reply(comment_text, name):
              prompt = HEALING_PROMPT.format(comment_text=comment_text, name=name)
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={"model": "llama-3.1-8b-instant", "messages": [{"role": "user", "content": prompt}], "max_tokens": 120}, timeout=20)
                  r.raise_for_status()
                  print("Used Groq")
                  return r.json()['choices'][0]['message']['content']
              except Exception as e:
                  print(f"Groq failed {e} -> Backup")
                  try:
                      r2 = requests.post("https://openrouter.ai/api/v1/chat/completions",
                          headers={"Authorization": f"Bearer {OPENROUTER_KEY}", "Content-Type": "application/json"},
                          json={"model": "meta-llama/llama-3.1-8b-instruct:free", "messages": [{"role": "user", "content": prompt}]}, timeout=30)
                      r2.raise_for_status()
                      print("Used OpenRouter backup")
                      return r2.json()['choices'][0]['message']['content']
                  except Exception as e2:
                      print(f"Backup failed {e2}")
                      return None

          for post in posts:
              post_id = post['id']
              print(f"Checking post {post_id}")
              comments_url = f"https://graph.facebook.com/v19.0/{post_id}/comments?order=reverse_chronological&fields=id,message,from,comments{{from}}&limit=50&access_token={PAGE_TOKEN}"
              comments_data = requests.get(comments_url).json().get('data', [])
              print(f"Found {len(comments_data)} comments")
              for c in comments_data:
                  text=c.get('message',''); name=c.get('from',{}).get('name',''); cid=c['id']; replies=c.get('comments',{}).get('data',[])
                  print(f"Check comment by {name}: {text[:30]}")
                  if any(rep.get('from',{}).get('id')==PAGE_ID for rep in replies):
                      print(f"Skip {name} - already replied")
                      continue
                  if not text or c.get('from',{}).get('id')==PAGE_ID: continue
                  reply=get_healing_reply(text,name)
                  if not reply: continue
                  requests.post(f"https://graph.facebook.com/v19.0/{cid}/comments", data={"message": reply, "access_token": PAGE_TOKEN})
                  print(f"REPLIED to {name}")
                  time.sleep(5)
          print("Done")
          PY
