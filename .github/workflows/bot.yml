name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 17 * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: V16 REAL AI
        shell: python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, requests, re, json, random, subprocess
          gk=os.getenv("GROQ_API_KEY")
          pt=os.getenv("FB_PAGE_ACCESS_TOKEN")
          pid=os.getenv("FB_PAGE_ID")
          gh=os.getenv("GH_TOKEN")
          mem_file="replied_comments.json"
          learn_file="learned_topics.json"
          memory=json.load(open(mem_file)) if os.path.exists(mem_file) else []
          learned=json.load(open(learn_file)) if os.path.exists(learn_file) else []
          SYSTEM="You are REAL Satisfaction AI. Warm mature healer. Answer inside double quotes only, 18-24 words, 1-2 emojis, ends with question."
          def ask(sys, usr, model):
            try:
              r=requests.post("https://api.groq.com/openai/v1/chat/completions",headers={"Authorization":f"Bearer {gk}","Content-Type":"application/json"},json={"model":model,"messages":[{"role":"system","content":sys},{"role":"user","content":usr}],"max_tokens":300},timeout=40)
              j=r.json()
              msg=j["choices"][0]["message"]
              raw=msg.get("content") or msg.get("reasoning") or ""
              print(f"RAW from {model}: {raw[:500]}")
              m=re.search(r'"([^"]{10,400})"',raw,re.DOTALL)
              final=m.group(1).strip() if m else raw.strip()[:350]
              if len(final)<15:
                return ""
              return final
            except Exception as e:
              print(f"err {model}: {e}")
              return ""
          def research_topic():
            topics=["why kindness is revolutionary","how setting boundaries protects peace","self-worth when you feel behind","mental health its okay to not be okay","forgiveness as freedom","community healing checking on silent friends","words have power speak life","rest is productive","empathy listening to understand"]
            avail=[t for t in topics if t not in learned[-5:]]
            chosen=random.choice(avail or topics)
            learned.append(chosen)
            if len(learned)>30:
              learned.pop(0)
            open(learn_file,"w").write(json.dumps(learned))
            return chosen
          topic=research_topic()
          print(f"Researching: {topic}")
          post_text=ask(SYSTEM, f"Create Facebook post about {topic}. Positive impact. 18 words 2 emojis 2 hashtags #RealSatisfaction #Healing. Inside quotes.", "llama-3.1-8b-instant")
          if not post_text:
            post_text=ask(SYSTEM, f"Create Facebook post about {topic}. Positive impact. 18 words 2 emojis 2 hashtags #RealSatisfaction #Healing. Inside quotes.", "openai/gpt-oss-20b")
          print(f"FINAL REAL AI POST: {post_text}")
          if post_text and len(post_text)>15:
            url="https://graph.facebook.com/v20.0/"+pid+"/feed"
            fb=requests.post(url,data={"message":post_text,"access_token":pt}).json()
            print(f"FB Result: {fb}")
          else:
            print("Both models failed - no post")
          try:
            open(mem_file,"w").write(json.dumps(memory))
            subprocess.run(["git","config","user.name","bot"],check=True)
            subprocess.run(["git","config","user.email","bot@real.local"],check=True)
            subprocess.run(["git","add",mem_file,learn_file],check=True)
            subprocess.run(["git","commit","-m","V16 real AI"],check=True)
            subprocess.run(["git","push",f"https://x-access-token:{gh}@github.com/{os.getenv('GITHUB_REPOSITORY')}.git","HEAD:main"],check=True)
            print("Memory saved")
          except Exception as e:
            print(f"git: {e}")
