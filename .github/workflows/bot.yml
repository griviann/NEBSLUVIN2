name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run bot
        run: |
          cat > bot.py << 'ENDPYTHON'
          import os, json, random, time, requests
          from datetime import datetime, timezone, timedelta

          PAGE_ID = os.environ.get('PAGE_ID','').strip()
          PAGE_TOKEN = os.environ.get('PAGE_TOKEN','').strip()
          GROQ_KEY = os.environ.get('GROQ_API_KEY','').strip()

          if not PAGE_ID or not PAGE_TOKEN or not GROQ_KEY:
              print("Missing secret, stopping")
              exit(0)

          print(f"PAGE_ID len={len(PAGE_ID)} PAGE_TOKEN len={len(PAGE_TOKEN)}")
          EAT = timezone(timedelta(hours=3))
          now = datetime.now(EAT)
          should_post = (now.hour % 2 == 0 and now.minute < 5)

          def load_json(n,d):
            try:
              with open(n) as f:
                return json.load(f)
            except:
              return d

          replied=set(load_json("replied_comments.json",[]))
          known_users=load_json("known_users.json",{})

          def save():
            with open("replied_comments.json","w") as f:
              json.dump(list(replied),f)
            with open("known_users.json","w") as f:
              json.dump(known_users,f)

          def ask_groq(txt,name):
            is_returning = name in known_users
            visits = known_users.get(name, 0)
            system_prompt = f"You are REAL Satisfaction, warm Kenyan healer. Rules: 1.Learner {name} visited {visits} times. 2.Listener reflect '{txt}'. 3.Decoder understand feeling. 4.Adaptive mirror language. 5.Interpersonal warm 25 words 1 emoji. Reply now:"
            try:
              r=requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization": f"Bearer {GROQ_KEY}","Content-Type":"application/json"}, json={"model":"llama-3.3-70b-versatile","messages":[{"role":"system","content":system_prompt}],"temperature":0.82,"max_tokens":120}, timeout=25)
              if r.status_code==200:
                return r.json()['choices'][0]['message']['content'].strip()[:240]
              print(f"Groq {r.status_code} {r.text[:200]}")
            except Exception as e:
              print(f"Groq err {e}")
            return f"Karibu sana {name}, niko hapa. Unabeba nini leo?"

          if should_post:
            msg = random.choice(["One Kenyan Chair For All Sometimes you just need a place to breathe. What are you carrying today?","Leo hakuna haraka. Keti tu. Unabeba nini moyoni?","Real Satisfaction is listening, not fixing. Niko hapa."])
            try:
              requests.post(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed", data={"message":msg,"access_token":PAGE_TOKEN}, timeout=20)
              print("Posted chair")
            except Exception as e:
              print(f"Post err {e}")

          try:
            posts=requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed?limit=5&access_token={PAGE_TOKEN}", timeout=20).json().get('data',[])
          except Exception as e:
            print(f"Feed err {e}")
            posts=[]

          print(f"Found {len(posts)} posts")
          c=0
          for p in posts:
            if c>=5:
              break
            try:
              comms=requests.get(f"https://graph.facebook.com/v19.0/{p['id']}/comments?limit=20&access_token={PAGE_TOKEN}", timeout=20).json().get('data',[])
            except Exception as e:
              print(f"Comments err {e}")
              comms=[]
            for comm in comms:
              if c>=5:
                break
              if comm['id'] in replied:
                continue
              if comm.get('from',{}).get('id')==PAGE_ID:
                continue
              txt=comm.get('message','').strip()
              if len(txt)<2 or len(txt)>500:
                continue
              name=comm.get('from',{}).get('name','rafiki').split()[0][:20]
              reply=ask_groq(txt,name)
              try:
                ok=requests.post(f"https://graph.facebook.com/v19.0/{comm['id']}/comments", data={"message":reply,"access_token":PAGE_TOKEN}, timeout=20)
                if ok.status_code==200:
                  replied.add(comm['id'])
                  known_users[name] = known_users.get(name, 0) + 1
                  save()
                  c+=1
                  print(f"Replied to {name}")
                  time.sleep(3)
              except Exception as e:
                print(f"Reply err {e}")
          save()
          ENDPYTHON
          python bot.py
        env:
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add replied_comments.json known_users.json || true
          git diff --staged --quiet || git commit -m "update memory - learner bot"
          git push || true
