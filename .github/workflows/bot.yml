name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python - << 'PY'
          import os,requests,re
          gk=os.getenv("GROQ_API_KEY")
          pt=os.getenv("FB_PAGE_ACCESS_TOKEN")
          pid=os.getenv("FB_PAGE_ID")
          def clean(t):
              t=t.split("\n")[0]
              t=re.sub(r'\(\d+\)','',t)
              t=re.sub(r'\b\w+\d+\b','',t)
              return t.strip(' "\'')
          r=requests.post("https://api.groq.com/openai/v1/chat/completions",headers={"Authorization":f"Bearer {gk}","Content-Type":"application/json"},json={"model":"openai/gpt-oss-20b","messages":[{"role":"system","content":"Output ONLY one line Facebook post."},{"role":"user","content":"Write Facebook post about self love healing, under 20 words, 2 emojis, 2 hashtags, one line only."}],"max_tokens":60,"temperature":0.8},timeout=30)
          raw=r.json()["choices"][0]["message"]["content"]
          print(f"RAW:{raw}")
          post=clean(raw)
          if "Count" in post: post=post.split("Count")[0]
          print(f"CLEAN:{post}")
          requests.post(f"https://graph.facebook.com/v20.0/{pid}/feed",data={"message":post,"access_token":pt})
          PY
