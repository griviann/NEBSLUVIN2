name: bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: V3.3 FIXED - Free Models Oct 2026
        shell: python
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os, requests, re, json, random, subprocess, datetime
          gk=os.getenv("GROQ_API_KEY")
          pt=os.getenv("FB_PAGE_ACCESS_TOKEN")
          pid=os.getenv("FB_PAGE_ID")
          gh=os.getenv("GH_TOKEN")
          
          mem_file="replied_comments.json"
          inbox_file="replied_inbox.json"
          learn_file="learned_topics.json"
          
          memory=json.load(open(mem_file)) if os.path.exists(mem_file) else []
          inbox_mem=json.load(open(inbox_file)) if os.path.exists(inbox_file) else []
          learned=json.load(open(learn_file)) if os.path.exists(learn_file) else []
          
          def is_clean(t):
              if not t: return False
              low=t.lower()
              if "answer inside double quotes" in low: return False
              if "18-24 words" in low: return False
              return True
          
          def ask_groq(sys_prompt, user_prompt):
              MODELS=["openai/gpt-oss-20b","openai/gpt-oss-120b"]
              for model in MODELS:
                  try:
                      r=requests.post("https://api.groq.com/openai/v1/chat/completions",
                          headers={"Authorization":f"Bearer {gk}","Content-Type":"application/json"},
                          json={"model":model,"messages":[{"role":"system","content":sys_prompt},{"role":"user","content":user_prompt}],"max_tokens":300},
                          timeout=40)
                      j=r.json()
                      print(f"TRY {model}: {str(j)[:800]}")
                      if "choices" not in j:
                          print(f"NO ACCESS {model}: {j.get('error')}")
                          continue
                      raw=j["choices"][0]["message"].get("content") or ""
                      print(f"RAW: {raw[:400]}")
                      m=re.search(r'"([^"]{10,400})"',raw,re.DOTALL)
                      final=m.group(1).strip() if m else raw.strip()[:350]
                      final=final.strip().rstrip("?").strip()
                      if is_clean(final) and len(final)>15:
                          print(f"SUCCESS {model}: {final}")
                          return final
                  except Exception as e:
                      print(f"err {model}: {e}")
                      continue
              return ""
          
          now=datetime.datetime.now()
          should_post=(now.hour%3==0 and now.minute<20)
          print(f"UTC hour {now.hour} minute {now.minute} should_post={should_post}")
          
          if should_post:
              topics=["why kindness is revolutionary","how setting boundaries protects peace","self-worth when you feel behind","mental health its okay to not be okay","forgiveness as freedom","community healing checking on silent friends","words have power speak life","rest is productive","empathy listening to understand"]
              avail=[t for t in topics if t not in learned[-5:]]
              chosen=random.choice(avail or topics)
              learned.append(chosen)
              if len(learned)>30: learned.pop(0)
              open(learn_file,"w").write(json.dumps(learned))
              print(f"Researching: {chosen}")
              post_text=ask_groq("You are REAL Satisfaction AI. Warm mature healer. Answer inside double quotes only, 18-24 words, 1-2 emojis, ends with question.", f"Create Facebook post about {chosen}. Positive impact. Inside quotes.")
              print(f"FINAL POST: {post_text}")
              if post_text:
                  final_fb=f"{post_text}? 🌱🤝 #RealSatisfaction #Healing"
                  url=f"https://graph.facebook.com/v20.0/{pid}/feed"
                  fb=requests.post(url,data={"message":final_fb,"access_token":pt}).json()
                  print(f"FB Post: {fb}")
          else:
              print("Skip post this run")
          
          # COMMENTS
          try:
              posts=requests.get(f"https://graph.facebook.com/v20.0/{pid}/posts",params={"access_token":pt,"limit":5}).json().get("data",[])
              for p in posts:
                  comms=requests.get(f"https://graph.facebook.com/v20.0/{p['id']}/comments",params={"access_token":pt,"fields":"id,message,from","limit":20}).json().get("data",[])
                  for c in comms:
                      cid=c["id"]
                      if cid in memory: continue
                      if c.get("from",{}).get("id")==pid: continue
                      if not c.get("message"): continue
                      reply="Asante sana for sharing. You help our community heal together? 🌱"
                      requests.post(f"https://graph.facebook.com/v20.0/{cid}/comments",data={"message":reply,"access_token":pt})
                      memory.append(cid)
                      print(f"Replied {cid}")
                      if len(memory)>300: memory=memory[-300:]
          except Exception as e:
              print(f"comment error: {e}")
          
          # INBOX
          try:
              convs=requests.get(f"https://graph.facebook.com/v20.0/{pid}/conversations",params={"access_token":pt,"fields":"id,messages{id,message,from}","limit":10}).json().get("data",[])
              for conv in convs[:10]:
                  msgs=conv.get("messages",{}).get("data",[])
                  if not msgs: continue
                  last=msgs[0]
                  mid=last["id"]
                  if mid in inbox_mem: continue
                  if last.get("from",{}).get("id")==pid: continue
                  rep="Asante kwa DM mkuu. Nimepokea message yako. Niko hapa kukusupport, poa poa?"
                  requests.post(f"https://graph.facebook.com/v20.0/{conv['id']}/messages",data={"message":rep,"access_token":pt})
                  inbox_mem.append(mid)
                  print(f"Inbox {mid}")
                  if len(inbox_mem)>300: inbox_mem=inbox_mem[-300:]
          except Exception as e:
              print(f"inbox error: {e}")
          
          # SAVE
          try:
              open(mem_file,"w").write(json.dumps(memory))
              open(inbox_file,"w").write(json.dumps(inbox_mem))
              open(learn_file,"w").write(json.dumps(learned))
              subprocess.run(["git","config","user.name","bot"],check=True)
              subprocess.run(["git","config","user.email","bot@real.local"],check=True)
              subprocess.run(["git","add",mem_file,inbox_file,learn_file],check=True)
              subprocess.run(["git","commit","-m","V3.3 fixed free models"],check=True)
              subprocess.run(["git","push",f"https://x-access-token:{gh}@github.com/{os.getenv('GITHUB_REPOSITORY')}.git","HEAD:main"],check=True)
              print("Memory saved")
          except Exception as e:
              print(f"git: {e}")
