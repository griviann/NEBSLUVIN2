      - name: Check Groq and Facebook Connections
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION || 'v20.0' }}
        run: |
          python - <<'PY'
          import os, sys, requests
          groq_key = os.getenv("GROQ_API_KEY")
          page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
          page_id = os.getenv("FB_PAGE_ID")
          version = os.getenv("FACEBOOK_API_VERSION", "v20.0")
          print("=== RealSatisfaction AI Health Check ===")
          r = requests.post("https://api.groq.com/openai/v1/chat/completions",
            headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
            json={"model": "openai/gpt-oss-20b", "messages": [{"role": "user", "content": "Reply with OK"}], "max_tokens": 100, "temperature": 0},
            timeout=30)
          data = r.json()
          msg = (data.get("choices") or [{}])[0].get("message") or {}
          final = (msg.get("content") or msg.get("reasoning") or msg.get("reasoning_content") or "").strip()
          if r.ok and final:
              print(f"GROQ: PASS - {final}")
          else:
              print(f"GROQ: FAIL - {data}")
              sys.exit(1)
          rf = requests.get(f"https://graph.facebook.com/{version}/{page_id}", params={"fields": "id,name", "access_token": page_token}, timeout=25)
          df = rf.json()
          if rf.ok and str(df.get("id")) == str(page_id):
              print(f"FACEBOOK: PASS - {df.get('name')}")
          else:
              print(f"FACEBOOK: FAIL - {df}")
              sys.exit(1)
          print("OVERALL: PASS")
          PY
