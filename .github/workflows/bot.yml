      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION || 'v20.0' }}
          ACTION: ${{ github.event.inputs.action || 'post' }}
        run: |
          cat > /tmp/bot.py << 'PY'
          import os, requests, random, re
          groq_key = os.getenv("GROQ_API_KEY")
          page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
          page_id = os.getenv("FB_PAGE_ID")
          version = os.getenv("FACEBOOK_API_VERSION", "v20.0")

          def clean_post(text):
              # Take only first line/paragraph before reasoning artifacts
              text = text.strip()
              # Remove everything after these markers
              for marker in ["\nCount words", "Count words:", "So 18 words", "within limit", "Good."]:
                  if marker.lower() in text.lower():
                      text = text.split(marker)[0] if marker in text else text.lower().split(marker.lower())[0]
              # Remove quotes, newlines, extra counting
              text = text.split("\n")[0].strip()
              text = text.strip('"').strip("'")
              # Remove word counts like (1) the2
              text = re.sub(r'\(\d+\)', '', text)
              text = re.sub(r'\b\w+\d+\b', '', text)  # removes the2, moments4
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          r = requests.post("https://api.groq.com/openai/v1/chat/completions",
              headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
              json={
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {"role": "system", "content": "You are Facebook writer. Output ONLY the final Facebook post in one line. No word counting, no explanation, no reasoning. Just the post."},
                      {"role": "user", "content": "Write a Facebook post about self love healing. Under 25 words, emotional, 2 emojis max, 2 hashtags max. One line only."}
                  ],
                  "max_tokens": 80,
                  "temperature": 0.8
              }, timeout=30)
          data = r.json()
          raw = data.get("choices", [{}])[0].get("message", {}).get("content", "")
          print(f"RAW: {raw}")
          cleaned = clean_post(raw)
          print(f"CLEAN: {cleaned}")

          if len(cleaned) < 10 or "count" in cleaned.lower():
              print("Still dirty, abort")
              exit(0)

          pr = requests.post(f"https://graph.facebook.com/{version}/{page_id}/feed", data={"message": cleaned, "access_token": page_token}, timeout=25)
          print(f"FB: {pr.status_code} - {pr.json()}")
          PY
          python /tmp/bot.pyname: RealSatisfaction AI Automation Scheduler

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'post'
        type: choice
        options:
          - health_check
          - post

concurrency:
  group: realsatisfaction-bot
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: python -m pip install requests
      - name: Run Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FACEBOOK_API_VERSION: ${{ secrets.FACEBOOK_API_VERSION || 'v20.0' }}
          ACTION: ${{ github.event.inputs.action || 'post' }}
        run: |
          cat > /tmp/bot.py << 'PY'
          import os, requests, random
          groq_key = os.getenv("GROQ_API_KEY")
          page_token = os.getenv("FB_PAGE_ACCESS_TOKEN")
          page_id = os.getenv("FB_PAGE_ID")
          version = os.getenv("FACEBOOK_API_VERSION", "v20.0")
          action = os.getenv("ACTION", "post")

          def health_check():
              r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
                  json={"model": "openai/gpt-oss-20b", "messages": [{"role": "user", "content": "Reply OK"}], "max_tokens": 20, "temperature": 0}, timeout=30)
              data = r.json()
              # ONLY use content, never reasoning
              content = data.get("choices", [{}])[0].get("message", {}).get("content", "").strip()
              print(f"GROQ: {'PASS' if content else 'FAIL'} - {content} - Model: gpt-oss-20b")
              rf = requests.get(f"https://graph.facebook.com/{version}/{page_id}", params={"fields": "id,name", "access_token": page_token}, timeout=25)
              print(f"FACEBOOK: {'PASS' if rf.ok else 'FAIL'} - {rf.json()}")

          def create_post():
              topics = ["customer satisfaction is real love", "self love and healing", "loyalty and trust"]
              prompt = f"Write a Facebook post about {random.choice(topics)}. Under 35 words, emotional, 2 emojis, 2 hashtags. Output ONLY the post."
              r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                  headers={"Authorization": f"Bearer {groq_key}", "Content-Type": "application/json"},
                  json={"model": "openai/gpt-oss-20b", "messages": [{"role": "system", "content": "You are Facebook writer. Output ONLY final post. No reasoning, no chain-of-thought."}, {"role": "user", "content": prompt}], "max_tokens": 150, "temperature": 0.8}, timeout=30)
              data = r.json()
              print(f"Raw: {data}")
              # CRITICAL: Only content, ignore reasoning fields
              msg = data.get("choices", [{}])[0].get("message", {})
              content = (msg.get("content") or "").strip()

              # If model puts reasoning in content, extract after "final:"
              if "final:" in content.lower():
                  content = content.lower().split("final:")[-1].strip()

              content = content.strip('"').strip("'")
              if not content or len(content) < 10:
                  print(f"Failed: {data}")
                  return
              # Block leak words
              if any(x in content.lower() for x in ["we need to", "let's craft", "we should", "reasoning"]):
                  print(f"BLOCKED LEAK, retry blocked: {content}")
                  return

              print(f"CLEAN POST: {content}")
              pr = requests.post(f"https://graph.facebook.com/{version}/{page_id}/feed", data={"message": content, "access_token": page_token}, timeout=25)
              print(f"FB: {pr.status_code} - {pr.json()}")

          health_check()
          if action != "health_check":
              create_post()
          PY
          python /tmp/bot.py
