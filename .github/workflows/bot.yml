name: bot
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python - << 'PY'
          import os, json, random, time, requests
          from datetime import datetime, timezone, timedelta

          PAGE_ID = os.environ['PAGE_ID']
          PAGE_TOKEN = os.environ['PAGE_TOKEN']
          GROQ_KEY = os.environ['GROQ_API_KEY']
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          EAT = timezone(timedelta(hours=3))
          now_eat = datetime.now(EAT)
          should_post = (now_eat.hour % 2 == 0 and now_eat.minute < 15)

          def load_json(name, default):
              try:
                  with open(name) as f: return json.load(f)
              except: return default

          replied = set(load_json("replied_comments.json", []))
          users = load_json("known_users.json", {})

          def save():
              with open("replied_comments.json","w") as f: json.dump(list(replied), f)
              with open("known_users.json","w") as f: json.dump(users, f)

          def ask_groq(user_text, name, is_new):
              txt = user_text.strip()[:300]
              sys_p = f"""You are REAL Satisfaction, a warm Kenyan human healer behind One Kenyan Chair For All. You are NOT a bot.

              Chair: safe space where Kenyans rest when life is heavy. No fixing, just listening.

              Talking to: {name}, {'NEW' if is_new else 'returning friend'}.

              THINK: Feel first what they feel. If "where have you been / me please" = they are vulnerable, don't give definition. Be warm, personal: "nimerudi, missed this space".

              STYLE: 18-30 words, Kenyan WhatsApp Swahili+English natural, 1 emoji max (💛🤝🌙🪑), end with soft question, fresh never repeat.

              User said: "{txt}"
              Reply as REAL:"""
              try:
                  r = requests.post(GROQ_URL, headers={"Authorization": f"Bearer {GROQ_KEY}","Content-Type":"application/json"},
                  json={"model":"llama-3.3-70b-versatile","messages":[{"role":"system","content":sys_p},{"role":"user","content":txt}],"temperature":0.85,"max_tokens":120}, timeout=20)
                  if r.status_code==200:
                      ans = r.json()['choices'][0]['message']['content'].strip()
                      ans = ans.replace("today this one is yours","this chair is yours for now")
                      return ans[:220]
              except Exception as e:
                  print(f"Groq fail {e}")
              fallbacks = [
                  f"Karibu sana {name}, niko hapa. Take a breath, you don't have to be strong here. What is heavy today? 🤝",
                  f"Hey {name}, thanks for coming, this chair is yours now. I'm really listening, unajisikiaje leo? 💛",
                  f"Karibu {name}, asante for trusting this space. I'm here, no rush. What would you like to share? 🪑"
              ]
              return random.choice(fallbacks)

          # --- POSTING FULL VERSION ---
          if should_post:
              print(f"Posting time {now_eat}")
              prompts = [
                  "One Kenyan Chair For All 🪑\n\nSometimes you don't need advice, you just need a place to breathe. This chair is yours today. What are you carrying that feels heavy? I'm here to listen, not to judge. 💛",
                  "Karibu sana One Kenyan Chair For All 🌙\n\nUsiku mrefu? If your thoughts are too loud tonight, come sit. You don't have to be okay to be welcome here. Unajisikiaje leo?",
                  "Hey, One Kenyan Chair For All 🤝\n\nHealing is not a straight line. Some days you sit, some days you stand. Today, just sit with me. What's one thing you wish someone would understand about you?",
                  "One Kenyan Chair For All 💛\n\nYou are not too much. Your story matters. If no one told you today - niko hapa kukusikia. Karibu sana, what would you like to put down?",
                  "Karibu One Kenyan Chair For All 🪑\n\nNo fixing, no preaching. Just a human listening to another human. If you need a 'Me please', say it. This space is yours."
              ]
              msg = random.choice(prompts)
              try:
                  r = requests.post(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed", data={"message": msg, "access_token": PAGE_TOKEN}, timeout=15)
                  print(f"Post result: {r.json()}")
              except Exception as e:
                  print(e)

          # --- REPLY LOGIC FIXED ---
          print("Found posts to check")
          try:
              url = f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed?limit=5&access_token={PAGE_TOKEN}"
              resp = requests.get(url, timeout=15).json()
              print(f"RAW FB RESPONSE: {resp}")
              posts = resp.get('data',[])
              print(f"Found {len(posts)} posts to check comments")
              count=0
              for p in posts:
                  if count>=5: break
                  pid=p['id']
                  comms = requests.get(f"https://graph.facebook.com/v19.0/{pid}/comments?limit=30&filter=stream&access_token={PAGE_TOKEN}", timeout=15).json().get('data',[])
                  for c in comms:
                      cid=c['id']
                      if cid in replied: continue
                      if c.get('from',{}).get('id')==PAGE_ID: continue
                      text=c.get('message','')
                      if not text or len(text.strip())<2: continue
                      from_id = c.get('from',{}).get('id','')
                      from_name = c.get('from',{}).get('name','rafiki')
                      is_new = from_id not in users
                      reply_text = ask_groq(text, from_name.split()[0], is_new)
                      rr = requests.post(f"https://graph.facebook.com/v19.0/{cid}/comments", data={"message": reply_text, "access_token": PAGE_TOKEN}, timeout=15)
                      if rr.status_code==200:
                          print(f"Replied to {cid}: {reply_text}")
                          replied.add(cid)
                          users[from_id]=from_name
                          save()
                          count+=1
                          time.sleep(2)
                      else:
                          print(f"Reply fail {rr.text}")
                      if count>=5: break
          except Exception as e:
              print(f"Comment loop error {e}")
          save()
          PY
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add replied_comments.json known_users.json || true
          git diff --staged --quiet || git commit -m "update memory"
          git push || true
