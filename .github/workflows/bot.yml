name: heal
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Reply - Fixed No Duplicate + OpenRouter Backup
        env:
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - << 'PY'
          import requests, os, time
          PAGE_ID = os.getenv("PAGE_ID","").strip()
          PAGE_TOKEN = os.getenv("PAGE_TOKEN","").strip()
          GROQ_KEY = os.getenv("GROQ_KEY","").strip()
          OPENROUTER_KEY = os.getenv("OPENROUTER_KEY","").strip()

          print(f"Checking PAGE_ID: {PAGE_ID}")

          # 1. GET POSTS - FIXED
          url = f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed?limit=3&access_token={PAGE_TOKEN}"
          res = requests.get(url).json()
          if "error" in res:
              print(f"FB Error: {res['error']}")
              exit(0)
          posts = res.get("data", [])
          print(f"Found {len(posts)} posts - OK")

          PROMPT = "You are REAL satisfaction Kenyan Chair, warm healing Sheng mix. Chair=mahali pa kupumua bila kuhukumiwa. Pole pole, karibu sana. Reply 50 words max warm. Comment: {c} Name: {n}"

          def get_ai_reply(comment_text, name):
              prompt = PROMPT.format(c=comment_text, n=name)
              # Try GROQ first
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions",
                      headers={"Authorization": f"Bearer {GROQ_KEY}", "Content-Type": "application/json"},
                      json={"model": "llama-3.1-8b-instant", "messages": [{"role": "user", "content": prompt}], "max_tokens": 120}, timeout=15)
                  r.raise_for_status()
                  print("-> Groq used")
                  return r.json()['choices'][0]['message']['content']
              except Exception as e:
                  print(f"Groq failed: {e}")
                  # Backup OPENROUTER - FIXED HEADERS
                  try:
                      r2 = requests.post("https://openrouter.ai/api/v1/chat/completions",
                          headers={
                              "Authorization": f"Bearer {OPENROUTER_KEY}",
                              "Content-Type": "application/json",
                              "HTTP-Referer": "https://github.com",
                              "X-Title": "REAL Chair Healer"
                          },
                          json={"model": "meta-llama/llama-3.1-8b-instruct:free", "messages": [{"role": "user", "content": prompt}]},
                          timeout=25)
                      r2.raise_for_status()
                      print("-> OpenRouter backup used")
                      return r2.json()['choices'][0]['message']['content']
                  except Exception as e2:
                      print(f"OpenRouter also failed: {e2} - {r2.text if 'r2' in locals() else ''}")
                      return None

          for post in posts:
              pid = post['id']
              c_url = f"https://graph.facebook.com/v19.0/{pid}/comments?order=reverse_chronological&fields=id,message,from,comments{{from}}&limit=50&access_token={PAGE_TOKEN}"
              comms = requests.get(c_url).json().get('data', [])
              print(f"Post {pid} has {len(comms)} comments")
              for c in comms:
                  txt = c.get('message','')
                  name = c.get('from',{}).get('name','')
                  cid = c['id']
                  replies = c.get('comments',{}).get('data',[])
                  if any(rep.get('from',{}).get('id')==PAGE_ID for rep in replies):
                      print(f"Skip {name} - already replied")
                      continue
                  if not txt or c.get('from',{}).get('id')==PAGE_ID:
                      continue
                  print(f"Replying to {name}: {txt[:40]}")
                  reply = get_ai_reply(txt, name)
                  if not reply: 
                      print("No AI reply, skip")
                      continue
                  requests.post(f"https://graph.facebook.com/v19.0/{cid}/comments", data={"message": reply, "access_token": PAGE_TOKEN})
                  print(f"REPLIED to {name}")
                  time.sleep(4)
          print("Done - success")
          PY
