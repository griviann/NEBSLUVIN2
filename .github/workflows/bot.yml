name: bot
on: workflow_dispatch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python - << 'PY'
          import os, requests
          PAGE_ID = os.environ['PAGE_ID'].strip()
          PAGE_TOKEN = os.environ['PAGE_TOKEN'].strip()
          print(f"PAGE_ID len={len(PAGE_ID)} first4={PAGE_ID[:4]}")
          print(f"PAGE_TOKEN len={len(PAGE_TOKEN)}")
          
          # TEST 1: Read page
          r = requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}?fields=name&access_token={PAGE_TOKEN}").json()
          print(f"TEST PAGE: {r}")
          
          # TEST 2: Read posts
          r2 = requests.get(f"https://graph.facebook.com/v19.0/{PAGE_ID}/posts?limit=2&access_token={PAGE_TOKEN}").json()
          print(f"TEST POSTS: {r2}")
          
          # TEST 3: Post something simple
          r3 = requests.post(f"https://graph.facebook.com/v19.0/{PAGE_ID}/feed", data={"message": "Test - bot is alive again 🪑", "access_token": PAGE_TOKEN}).json()
          print(f"TEST POSTING: {r3}")
          PY
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.PAGE_TOKEN }}
