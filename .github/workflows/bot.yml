                      "https://api.groq.com/openai/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {groq_key}",
                          "Content-Type": "application/json",
                      },
                      json={
                          "model": "openai/gpt-oss-20b",
                          "messages": [
                              {"role": "user", "content": "Reply with OK"}
                          ],
                          "max_tokens": 100,
                          "temperature": 0,
                      },
                      timeout=30,
                  )
